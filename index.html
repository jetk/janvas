<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>janvas</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    background: #f5f4f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 0;
  }
  svg {
    max-width: 70vmin;
    max-height: 70vmin;
  }
  #inner polygon, #outer polygon {
    fill: #000;
  }
  #inner, #outer {
    transform-box: fill-box;
    transform-origin: center;
  }
  #inner {
    animation-name: spin-cw;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  #outer {
    animation-name: spin-ccw;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes spin-cw {
    to { transform: rotate(360deg); }
  }
  @keyframes spin-ccw {
    to { transform: rotate(-360deg); }
  }
  h1 {
    margin: 0;
    font-size: 14px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #2b2b2b;
    font-weight: 500;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 48px;
    padding: 16px 24px 24px;
    border-top: 1px solid #ddd9d0;
    background: #f5f4f0;
    flex-wrap: wrap;
  }
  .ring-controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 180px;
  }
  .ring-controls h2 {
    margin: 0 0 2px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #2b2b2b;
  }
  .ring-controls label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    color: #555;
  }
  .ring-controls input[type="range"] {
    flex: 1;
    accent-color: #2b2b2b;
  }
</style>
</head>
<body>
  <div class="stage">
    <svg id="canvas" viewBox="0 0 460 460" width="460" height="460" xmlns="http://www.w3.org/2000/svg">
      <g id="outer"></g>
      <g id="inner"></g>
    </svg>
    <h1>janvas</h1>
  </div>

  <div class="controls">
    <div class="ring-controls">
      <h2>Inner ring</h2>
      <label>Size <input type="range" id="inner-size" min="3" max="14" step="0.5" value="5"></label>
      <label>Spacing <input type="range" id="inner-count" min="16" max="120" step="1" value="60"></label>
      <label>Speed <input type="range" id="inner-speed" min="2" max="40" step="1" value="12"></label>
    </div>
    <div class="ring-controls">
      <h2>Outer ring</h2>
      <label>Size <input type="range" id="outer-size" min="3" max="14" step="0.5" value="5"></label>
      <label>Spacing <input type="range" id="outer-count" min="16" max="160" step="1" value="84"></label>
      <label>Speed <input type="range" id="outer-speed" min="2" max="40" step="1" value="18"></label>
    </div>
  </div>

<script>
  const CX = 230, CY = 230;
  const SVGNS = "http://www.w3.org/2000/svg";

  function trianglePoints(R, N, hw, h, clockwise) {
    const sign = clockwise ? 1 : -1;
    const pts = [];
    for (let i = 0; i < N; i++) {
      const theta = (2 * Math.PI * i) / N;
      const ct = Math.cos(theta), st = Math.sin(theta);
      const rx = ct, ry = st;                 // radial unit vector
      let tx = -st, ty = ct;                  // tangential unit vector (clockwise, SVG y-down)
      tx *= sign; ty *= sign;
      const px = CX + R * ct, py = CY + R * st;
      const ax = px + hw * rx, ay = py + hw * ry;
      const bx = px - hw * rx, by = py - hw * ry;
      const apx = px + h * tx, apy = py + h * ty;
      pts.push(`${ax.toFixed(2)},${ay.toFixed(2)} ${bx.toFixed(2)},${by.toFixed(2)} ${apx.toFixed(2)},${apy.toFixed(2)}`);
    }
    return pts;
  }

  function buildRing(groupId, R, N, hw, h, clockwise) {
    const g = document.getElementById(groupId);
    g.innerHTML = "";
    const frag = document.createDocumentFragment();
    trianglePoints(R, N, hw, h, clockwise).forEach((p) => {
      const poly = document.createElementNS(SVGNS, "polygon");
      poly.setAttribute("points", p);
      frag.appendChild(poly);
    });
    g.appendChild(frag);
  }

  const els = {
    innerSize: document.getElementById("inner-size"),
    innerCount: document.getElementById("inner-count"),
    innerSpeed: document.getElementById("inner-speed"),
    outerSize: document.getElementById("outer-size"),
    outerCount: document.getElementById("outer-count"),
    outerSpeed: document.getElementById("outer-speed"),
  };

  function render() {
    const iSize = +els.innerSize.value, iCount = +els.innerCount.value, iSpeed = +els.innerSpeed.value;
    const oSize = +els.outerSize.value, oCount = +els.outerCount.value, oSpeed = +els.outerSpeed.value;

    buildRing("inner", 170, iCount, iSize, iSize * 3.2, true);
    buildRing("outer", 215, oCount, oSize, oSize * 3.2, false);

    document.getElementById("inner").style.animationDuration = iSpeed + "s";
    document.getElementById("outer").style.animationDuration = oSpeed + "s";
  }

  Object.values(els).forEach((el) => el.addEventListener("input", render));
  render();
</script>
</body>
</html>
