<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>janvas — orbit pairs</title>
<style>
  :root {
    --inner-color: #000000;
    --outer-color: #000000;
  }
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    background: #f5f4f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 0;
  }
  svg {
    max-width: 70vmin;
    max-height: 70vmin;
  }
  #inner circle {
    fill: var(--inner-color);
  }
  #outer circle {
    fill: var(--outer-color);
  }
  @keyframes spin-cw {
    to { transform: rotate(360deg); }
  }
  @keyframes spin-ccw {
    to { transform: rotate(-360deg); }
  }
  h1 {
    margin: 0;
    font-size: 14px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #2b2b2b;
    font-weight: 500;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 48px;
    padding: 16px 24px 24px;
    border-top: 1px solid #ddd9d0;
    background: #f5f4f0;
    flex-wrap: wrap;
  }
  .ring-controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 220px;
  }
  .ring-controls h2 {
    margin: 0 0 2px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #2b2b2b;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #555;
  }
  .row .name {
    width: 70px;
    flex: none;
  }
  .row input[type="range"] {
    flex: 1;
    accent-color: #2b2b2b;
  }
  .row input[type="number"] {
    width: 52px;
    font-size: 12px;
    border: 1px solid #ccc;
    border-radius: 3px;
    padding: 2px 4px;
  }
  .row input[type="color"] {
    width: 40px;
    height: 22px;
    padding: 0;
    border: 1px solid #ccc;
    border-radius: 3px;
    background: none;
  }
  .row .range-hint {
    font-size: 10px;
    color: #999;
    width: 56px;
    flex: none;
  }
  .pagenav {
    position: fixed;
    top: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .pagenav a {
    color: #2b2b2b;
    text-decoration: none;
    border-bottom: 1px solid #2b2b2b;
  }
</style>
</head>
<body>
  <nav class="pagenav"><a href="../">← Page 1</a></nav>
  <div class="stage">
    <svg id="canvas" viewBox="0 0 460 460" width="460" height="460" xmlns="http://www.w3.org/2000/svg">
      <g id="outer"></g>
      <g id="inner"></g>
    </svg>
    <h1>janvas</h1>
  </div>

  <div class="controls">
    <div class="ring-controls">
      <h2>Inner ring</h2>
      <div class="row">
        <span class="name">Size</span>
        <input type="range" id="inner-size" min="3" max="14" step="0.5" value="5">
        <input type="number" id="inner-size-n" min="3" max="14" step="0.5" value="5">
        <span class="range-hint">3–14</span>
      </div>
      <div class="row">
        <span class="name">Spacing</span>
        <input type="range" id="inner-spacing" min="2" max="30" step="0.5" value="10">
        <input type="number" id="inner-spacing-n" min="2" max="30" step="0.5" value="10">
        <span class="range-hint">2–30°</span>
      </div>
      <div class="row">
        <span class="name">Orbit speed</span>
        <input type="range" id="inner-speed" min="1" max="30" step="1" value="5">
        <input type="number" id="inner-speed-n" min="1" max="30" step="1" value="5">
        <span class="range-hint">1–30</span>
      </div>
      <div class="row">
        <span class="name">Color</span>
        <input type="color" id="inner-color" value="#000000">
      </div>
    </div>
    <div class="ring-controls">
      <h2>Outer ring</h2>
      <div class="row">
        <span class="name">Size</span>
        <input type="range" id="outer-size" min="3" max="14" step="0.5" value="5">
        <input type="number" id="outer-size-n" min="3" max="14" step="0.5" value="5">
        <span class="range-hint">3–14</span>
      </div>
      <div class="row">
        <span class="name">Spacing</span>
        <input type="range" id="outer-spacing" min="2" max="30" step="0.5" value="7">
        <input type="number" id="outer-spacing-n" min="2" max="30" step="0.5" value="7">
        <span class="range-hint">2–30°</span>
      </div>
      <div class="row">
        <span class="name">Orbit speed</span>
        <input type="range" id="outer-speed" min="1" max="30" step="1" value="3">
        <input type="number" id="outer-speed-n" min="1" max="30" step="1" value="3">
        <span class="range-hint">1–30</span>
      </div>
      <div class="row">
        <span class="name">Color</span>
        <input type="color" id="outer-color" value="#000000">
      </div>
    </div>
  </div>

<script>
  const CX = 230, CY = 230;
  const SVGNS = "http://www.w3.org/2000/svg";
  const SPEED_K = 60; // duration(s) = SPEED_K / speedValue -> higher speed value = faster orbit

  // --- Motion patterns -------------------------------------------------
  // Each pattern takes the circle radius (`size`) and returns the two
  // bodies of a pair as {cx, cy, r}, positioned relative to the pair's
  // center (which itself sits on the big ring). To add a new way for the
  // pair to move, add a function here and set CURRENT_PATTERN to its key
  // — buildPairGroup() and the per-frame CSS animation don't need to change
  // for patterns that are still "two bodies spinning around a shared center
  // at a fixed rate"; a pattern needing per-frame JS control (e.g. eccentric
  // orbits, pulsing radius) would instead drive its own rAF loop keyed off
  // performance.now() rather than a CSS animation-duration.
  const PATTERNS = {
    orbit(size) {
      const orbitR = size; // circles end up tangent at the pair center
      return [
        { cx: -orbitR, cy: 0, r: size },
        { cx: orbitR, cy: 0, r: size },
      ];
    },
  };
  const CURRENT_PATTERN = "orbit";

  function buildPairGroup(px, py, size, durationSeconds, clockwise) {
    const outerG = document.createElementNS(SVGNS, "g");
    outerG.setAttribute("transform", `translate(${px.toFixed(2)},${py.toFixed(2)})`);

    const spinG = document.createElementNS(SVGNS, "g");
    spinG.setAttribute("class", "spin");
    spinG.style.transformBox = "fill-box";
    spinG.style.transformOrigin = "center";
    spinG.style.animationName = clockwise ? "spin-cw" : "spin-ccw";
    spinG.style.animationTimingFunction = "linear";
    spinG.style.animationIterationCount = "infinite";
    spinG.style.animationDuration = durationSeconds + "s";

    PATTERNS[CURRENT_PATTERN](size).forEach((body) => {
      const c = document.createElementNS(SVGNS, "circle");
      c.setAttribute("cx", body.cx.toFixed(2));
      c.setAttribute("cy", body.cy.toFixed(2));
      c.setAttribute("r", body.r.toFixed(2));
      spinG.appendChild(c);
    });

    outerG.appendChild(spinG);
    return outerG;
  }

  function buildRing(groupId, R, N, size, durationSeconds, clockwise) {
    const g = document.getElementById(groupId);
    g.innerHTML = "";
    const frag = document.createDocumentFragment();
    for (let i = 0; i < N; i++) {
      const theta = (2 * Math.PI * i) / N;
      const px = CX + R * Math.cos(theta);
      const py = CY + R * Math.sin(theta);
      frag.appendChild(buildPairGroup(px, py, size, durationSeconds, clockwise));
    }
    g.appendChild(frag);
  }

  // Pair every range input with its number twin so either can be typed or dragged.
  function pair(rangeId, numberId, onChange) {
    const range = document.getElementById(rangeId);
    const number = document.getElementById(numberId);
    range.addEventListener("input", () => {
      number.value = range.value;
      onChange();
    });
    number.addEventListener("input", () => {
      let v = +number.value;
      const min = +number.min, max = +number.max;
      if (Number.isNaN(v)) return;
      v = Math.min(max, Math.max(min, v));
      range.value = v;
      onChange();
    });
  }

  function render() {
    const iSize = +document.getElementById("inner-size").value;
    const iSpacing = +document.getElementById("inner-spacing").value;
    const iSpeed = +document.getElementById("inner-speed").value;
    const oSize = +document.getElementById("outer-size").value;
    const oSpacing = +document.getElementById("outer-spacing").value;
    const oSpeed = +document.getElementById("outer-speed").value;

    const iCount = Math.max(6, Math.min(120, Math.round(360 / iSpacing)));
    const oCount = Math.max(6, Math.min(120, Math.round(360 / oSpacing)));

    buildRing("inner", 170, iCount, iSize, SPEED_K / iSpeed, true);
    buildRing("outer", 215, oCount, oSize, SPEED_K / oSpeed, false);

    document.documentElement.style.setProperty("--inner-color", document.getElementById("inner-color").value);
    document.documentElement.style.setProperty("--outer-color", document.getElementById("outer-color").value);
  }

  pair("inner-size", "inner-size-n", render);
  pair("inner-spacing", "inner-spacing-n", render);
  pair("inner-speed", "inner-speed-n", render);
  pair("outer-size", "outer-size-n", render);
  pair("outer-spacing", "outer-spacing-n", render);
  pair("outer-speed", "outer-speed-n", render);
  document.getElementById("inner-color").addEventListener("input", render);
  document.getElementById("outer-color").addEventListener("input", render);

  render();
</script>
</body>
</html>
