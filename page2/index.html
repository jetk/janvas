<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>janvas — orbit pairs</title>
<style>
  :root {
    --color-a: #000000;
    --color-b: #000000;
  }
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    background: #f5f4f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 0;
  }
  svg {
    max-width: 70vmin;
    max-height: 70vmin;
  }
  .half-a circle {
    fill: var(--color-a);
  }
  .half-b circle {
    fill: var(--color-b);
  }
  .spin {
    transform-box: view-box;
    transform-origin: 0px 0px;
    animation-name: spin-cw;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes spin-cw {
    to { transform: rotate(360deg); }
  }
  h1 {
    margin: 0;
    font-size: 14px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #2b2b2b;
    font-weight: 500;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 16px 24px 24px;
    border-top: 1px solid #ddd9d0;
    background: #f5f4f0;
    flex-wrap: wrap;
  }
  .ring-controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 200px;
  }
  .ring-controls h2 {
    margin: 0 0 2px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #2b2b2b;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #555;
  }
  .row .name {
    width: 60px;
    flex: none;
  }
  .row input[type="range"] {
    flex: 1;
    accent-color: #2b2b2b;
  }
  .row input[type="number"] {
    width: 52px;
    font-size: 12px;
    border: 1px solid #ccc;
    border-radius: 3px;
    padding: 2px 4px;
  }
  .row input[type="color"] {
    width: 40px;
    height: 22px;
    padding: 0;
    border: 1px solid #ccc;
    border-radius: 3px;
    background: none;
  }
  .row .range-hint {
    font-size: 10px;
    color: #999;
    width: 56px;
    flex: none;
  }
  .pagenav {
    position: fixed;
    top: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .pagenav.right {
    left: auto;
    right: 16px;
  }
  .pagenav a {
    color: #2b2b2b;
    text-decoration: none;
    border-bottom: 1px solid #2b2b2b;
  }
</style>
</head>
<body>
  <nav class="pagenav"><a href="../">← Page 1</a></nav>
  <nav class="pagenav right"><a href="../page3/">Page 3 →</a></nav>
  <div class="stage">
    <svg id="canvas" viewBox="0 0 460 460" width="460" height="460" xmlns="http://www.w3.org/2000/svg">
      <g id="ring"></g>
    </svg>
    <h1>janvas</h1>
  </div>

  <div class="controls">
    <div class="ring-controls">
      <h2>Ring</h2>
      <div class="row">
        <span class="name">Size</span>
        <input type="range" id="size" min="3" max="14" step="0.5" value="6">
        <input type="number" id="size-n" min="3" max="14" step="0.5" value="6">
        <span class="range-hint">3–14</span>
      </div>
      <div class="row">
        <span class="name">Spacing</span>
        <input type="range" id="spacing" min="2" max="30" step="0.5" value="8">
        <input type="number" id="spacing-n" min="2" max="30" step="0.5" value="8">
        <span class="range-hint">2–30°</span>
      </div>
    </div>
    <div class="ring-controls">
      <h2>Circle A</h2>
      <div class="row">
        <span class="name">Speed</span>
        <input type="range" id="speed-a" min="1" max="30" step="1" value="5">
        <input type="number" id="speed-a-n" min="1" max="30" step="1" value="5">
        <span class="range-hint">1–30</span>
      </div>
      <div class="row">
        <span class="name">Color</span>
        <input type="color" id="color-a" value="#000000">
      </div>
    </div>
    <div class="ring-controls">
      <h2>Circle B</h2>
      <div class="row">
        <span class="name">Speed</span>
        <input type="range" id="speed-b" min="1" max="30" step="1" value="5">
        <input type="number" id="speed-b-n" min="1" max="30" step="1" value="5">
        <span class="range-hint">1–30</span>
      </div>
      <div class="row">
        <span class="name">Color</span>
        <input type="color" id="color-b" value="#000000">
      </div>
    </div>
  </div>

<script>
  const CX = 230, CY = 230, R = 180;
  const SVGNS = "http://www.w3.org/2000/svg";
  const SPEED_K = 60; // duration(s) = SPEED_K / speedValue -> higher speed value = faster spin

  // --- Motion patterns -------------------------------------------------
  // A pattern places the two bodies of a pair at a starting local angle
  // (in degrees, measured from the pair's own +x axis) and an orbit radius.
  // Each pair is drawn as: translate to its position on the ring, then for
  // each body: a static rotate(phaseOffsetDeg) — the position on the ring —
  // wrapping an animated rotate(0 -> 360deg) at the given duration. Because
  // the static offset is the pair's own angle around the big ring, all
  // pairs' bodies start pointing radially at t=0 and re-align radially
  // together whenever the two speeds bring them back in phase. To add a
  // different pair choreography later, add a function here returning
  // { bodies: [{angleDeg, orbitR}, ...] } and switch CURRENT_PATTERN — a
  // pattern needing per-frame JS control (not just steady rotation) would
  // drive its own rAF loop instead of relying on CSS animation-duration.
  const PATTERNS = {
    orbit(size) {
      return {
        bodies: [
          { angleDeg: 0, orbitR: size },
          { angleDeg: 180, orbitR: size },
        ],
      };
    },
  };
  const CURRENT_PATTERN = "orbit";

  function buildPairGroup(px, py, ringAngleDeg, size, durationA, durationB) {
    const outerG = document.createElementNS(SVGNS, "g");
    outerG.setAttribute("transform", `translate(${px.toFixed(2)},${py.toFixed(2)})`);

    const { bodies } = PATTERNS[CURRENT_PATTERN](size);
    const durations = [durationA, durationB];
    const classes = ["half-a", "half-b"];

    bodies.forEach((body, idx) => {
      const phaseG = document.createElementNS(SVGNS, "g");
      // Static offset = this pair's angle on the ring, so every pair's
      // body starts pointed radially, in sync with every other pair.
      phaseG.setAttribute("transform", `rotate(${(ringAngleDeg + body.angleDeg).toFixed(2)})`);

      const spinG = document.createElementNS(SVGNS, "g");
      spinG.setAttribute("class", `spin ${classes[idx]}`);
      spinG.style.animationDuration = durations[idx] + "s";

      const c = document.createElementNS(SVGNS, "circle");
      c.setAttribute("cx", body.orbitR.toFixed(2));
      c.setAttribute("cy", "0");
      c.setAttribute("r", size.toFixed(2));
      spinG.appendChild(c);
      phaseG.appendChild(spinG);
      outerG.appendChild(phaseG);
    });

    return outerG;
  }

  function buildRing(N, size, durationA, durationB) {
    const g = document.getElementById("ring");
    g.innerHTML = "";
    const frag = document.createDocumentFragment();
    for (let i = 0; i < N; i++) {
      const thetaDeg = (360 * i) / N;
      const theta = (thetaDeg * Math.PI) / 180;
      const px = CX + R * Math.cos(theta);
      const py = CY + R * Math.sin(theta);
      frag.appendChild(buildPairGroup(px, py, thetaDeg, size, durationA, durationB));
    }
    g.appendChild(frag);
  }

  // Pair every range input with its number twin so either can be typed or dragged.
  function pair(rangeId, numberId, onChange) {
    const range = document.getElementById(rangeId);
    const number = document.getElementById(numberId);
    range.addEventListener("input", () => {
      number.value = range.value;
      onChange();
    });
    number.addEventListener("input", () => {
      let v = +number.value;
      const min = +number.min, max = +number.max;
      if (Number.isNaN(v)) return;
      v = Math.min(max, Math.max(min, v));
      range.value = v;
      onChange();
    });
  }

  function render() {
    const size = +document.getElementById("size").value;
    const spacing = +document.getElementById("spacing").value;
    const speedA = +document.getElementById("speed-a").value;
    const speedB = +document.getElementById("speed-b").value;

    const N = Math.max(6, Math.min(120, Math.round(360 / spacing)));

    buildRing(N, size, SPEED_K / speedA, SPEED_K / speedB);

    document.documentElement.style.setProperty("--color-a", document.getElementById("color-a").value);
    document.documentElement.style.setProperty("--color-b", document.getElementById("color-b").value);
  }

  pair("size", "size-n", render);
  pair("spacing", "spacing-n", render);
  pair("speed-a", "speed-a-n", render);
  pair("speed-b", "speed-b-n", render);
  document.getElementById("color-a").addEventListener("input", render);
  document.getElementById("color-b").addEventListener("input", render);

  render();
</script>
</body>
</html>
